name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - name: Check application regressions with temporary data
        run: |
          python -m unittest discover -s tests -p 'test_backend.py' -v
          python -m unittest discover -s tests -p 'test_ingestion_rag.py' -v
          python -m unittest discover -s tests -p 'test_sync_shutdown.py' -v
      - name: Check version identity examples
        run: python tests/test_versioning.py

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline release tools
        run: python -m unittest discover -s server/scripts/tests -p 'test_*.py' -v
      - name: Check standalone preparation
        run: python -m unittest discover -s server/standalone/tests -p 'test_*.py' -v
      - name: Check shell syntax
        run: |
          find server -name '*.sh' -exec bash -n {} \;

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
