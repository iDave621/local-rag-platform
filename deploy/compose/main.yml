name: local-rag-main
x-environment: &environment
  DATABASE_URL: ${REMOTE_DATABASE_URL:?Set REMOTE_DATABASE_URL with remote host and verified TLS}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  CHROMA_HOST: ${REMOTE_CHROMA_HOST:?Set REMOTE_CHROMA_HOST to the data-server DNS name or IP}
  CHROMA_PORT: ${REMOTE_CHROMA_PORT:-8443}
  CHROMA_SSL: "true"
  CHROMA_AUTH_TOKEN: ${CHROMA_AUTH_TOKEN:?Set the same CHROMA_AUTH_TOKEN on both servers}
  CHROMA_CA_FILE: /etc/local-rag/data-ca.crt
  OLLAMA_BASE_URL: http://ollama:11434
  DATA_ROOT: /data
  COOKIE_SECURE: "true"
  ANONYMIZED_TELEMETRY: "false"
  OTEL_SDK_DISABLED: "true"
  LANGCHAIN_TRACING_V2: "false"
  LANGSMITH_TRACING: "false"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
x-backend: &backend
  image: local-rag/backend:2.2.0
  pull_policy: never
  restart: unless-stopped
  env_file: ../../.env
  environment: *environment
  volumes: ["${HOST_DATA_PATH:-../../data}:/data", "${DATA_CA_PATH:?Set DATA_CA_PATH to the data-server CA certificate}:/etc/local-rag/data-ca.crt:ro"]
  depends_on:
    dependency-check: {condition: service_completed_successfully}
  stop_grace_period: 120s
services:
  redis:
    image: local-rag/redis:2.2.0
    pull_policy: never
    restart: unless-stopped
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"}
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["../../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro", redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
  ollama:
    image: local-rag/ollama:2.2.0
    pull_policy: never
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-1024}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_NO_CLOUD: "1"
    volumes: ["${OLLAMA_HOST_PATH:-../../data/ollama}:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
  db-init:
    <<: *backend
    restart: "no"
    depends_on: {}
    command: ["python", "-m", "app.cli", "init-db"]
  dependency-check:
    <<: *backend
    restart: "no"
    depends_on:
      db-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      ollama: {condition: service_healthy}
    command: ["sh", "-c", "for attempt in $$(seq 1 60); do python -m app.cli health --component all && exit 0; sleep 5; done; exit 1"]
  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "health", "--component", "api"]
      interval: 20s
      timeout: 20s
      retries: 6
      start_period: 120s
  chat-worker:
    <<: *backend
    environment: {<<: *environment, WORKER_QUEUES: high}
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "health", "--component", "worker", "--queues", "high"]
      interval: 30s
      timeout: 20s
      retries: 5
  background-worker:
    <<: *backend
    environment: {<<: *environment, WORKER_QUEUES: "medium,low"}
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "health", "--component", "worker", "--queues", "medium,low"]
      interval: 30s
      timeout: 20s
      retries: 5
  cleanup-worker:
    <<: *backend
    command: ["python", "-m", "app.cleanup_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "health", "--component", "cleanup"]
      interval: 30s
      timeout: 20s
      retries: 5
  sync-worker:
    <<: *backend
    command: ["python", "-m", "app.sync_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "health", "--component", "sync"]
      interval: 30s
      timeout: 20s
      retries: 5
  frontend:
    image: local-rag/frontend:2.2.0
    pull_policy: never
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports: ["${WEB_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"]
    volumes: ["${TLS_CERT_PATH:-../tls}:/etc/nginx/tls:ro"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes: {redis_data: {}}